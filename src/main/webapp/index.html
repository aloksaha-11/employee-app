    <div class="row">
      <div class="col">
        <h2>Add Employee</h2>
        <br />
        <form class="form-inline" id="employee-form" method="POST" action="./api">
          <div class="row g-3 align-items-center">
            <!-- ID -->
            <div class="col-auto">
              <label for="inputID" class="col-form-label">ID</label>
            </div>
            <div class="col-auto">
              <input
                type="text"
                class="form-control"
                name="id"
                id="inputID"
                placeholder="enter id"
              />
            </div>

            <!-- Name -->
            <div class="col-auto">
              <label for="inputName" class="col-form-label">Name</label>
            </div>
            <div class="col-auto">
              <input
                type="text"
                class="form-control"
                name="name" 
                id="inputName"
                placeholder="enter name"
              />
            </div>

            <!-- Age -->
            <div class="col-auto">
              <label for="inputAge" class="col-form-label">Age</label>
            </div>
            <div class="col-auto">
              <input
                type="text"
                class="form-control"
                name="age"
                id="inputAge"
                placeholder="enter age"
              />
            </div>

            <!-- Submit Button -->
            <div class="col-auto">
              <button type="button" class="btn btn-primary" id="add-employee">Add</button>
              &nbsp;
              <button type="button" class="btn btn-primary" id="refresh-data">Refresh</button>
            </div>
          </div>
        </form>
      </div>
    </div>
