          <h1>Employee Application</h1>
        </div>
      </div> <!-- Row end -->

      <div class="row">
        <div class="col">
          <form method="POST" action="./api">
            ID <input name="id" /> <br> <br />

            Age <input name="age" /> <br> <br />

          </div>
      </div>         <!--Row end -->

      <div class="row">
          <div class="col">
            <h2>View An Employee</h2> <br />
            <form method="GET" action="./api">
              ID <input name="id" /> <br> <br />
              <button type="submit">Submit</button> <br> <br />
            </form>
          </div>
      </div>         <!--Row end -->

      <div class="row">
          <div class="col"> 
            <h2>Delete An Employee</h2> <br />
            <form method="GET" action="./api">
              ID <input name="id" /> <br> <br />
              <input type="hidden" name="action" value="delete" />
              <button type="submit">Submit</button>
            </form>
          </div>
      </div>
