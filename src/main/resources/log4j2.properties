# Log4j 2 configuration (Log4j 2 ignores the old Log4j 1 name log4j.properties)
status = warn
name = employee-app

# Log folder: Tomcat's logs/ under Tomcat, ./logs in the project under jetty:run
property.logDir = ${sys:catalina.base:-.}/logs

appender.console.type = Console
appender.console.name = Console
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%t] %logger{36} - %msg%n

# jetty.log rolls over at 2 MB, keeping one backup (jetty.log.1)
appender.file.type = RollingFile
appender.file.name = File
appender.file.fileName = ${logDir}/jetty.log
appender.file.filePattern = ${logDir}/jetty.log.%i
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = %d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%t] %logger{36} - %msg%n
appender.file.policies.type = Policies
appender.file.policies.size.type = SizeBasedTriggeringPolicy
appender.file.policies.size.size = 2MB
appender.file.strategy.type = DefaultRolloverStrategy
appender.file.strategy.max = 1

rootLogger.level = info
rootLogger.appenderRef.console.ref = Console
rootLogger.appenderRef.file.ref = File

# Hibernate is noisy at info; raise to info or debug when troubleshooting
logger.hibernate.name = org.hibernate
logger.hibernate.level = warn

# Set to debug to log the SQL Hibernate runs
logger.hibernateSql.name = org.hibernate.SQL
logger.hibernateSql.level = warn
